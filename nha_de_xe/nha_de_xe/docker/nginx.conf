# Buổi 8: NGINX vừa phục vụ giao diện React, vừa reverse proxy /api tới các bản API.
# "api" là tên service trong docker-compose; có 2 bản thì DNS của Docker trả 2 IP và NGINX chia tải luân phiên.
# Chống dò mật khẩu, lớp 1: giới hạn số yêu cầu mỗi IP vào /api/auth/ (lớp 2, 3 nằm trong backend, làm ở module TaiKhoan).
# Vùng "dang_nhap", IP thật (set_real_ip_from / X-Real-IP) và biến $chan_swagger nằm ở conf.d/00-che-do-mang.conf,
# do docker/web-che-do-mang.sh sinh lúc khởi động theo WEB_BIND (máy chủ: 20/phút, tin X-Real-IP; LAN: 60/phút, không tin).
limit_req_status 429;

upstream api_backend {
    server api:8080;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    root /usr/share/nginx/html;

    # Khi chạy sau NGINX của VPS (HTTPS), $remote_addr là IP cổng Docker, không phải IP người dùng: IP thật lấy từ
    # X-Real-IP, CHỈ ở chế độ máy chủ (xem 00-che-do-mang.conf). Chế độ LAN không tin header này.

    location /api/auth/ {
        limit_req zone=dang_nhap burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, không nối header khách tự gửi (chống giả IP)
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SignalR (thông báo thời gian thực, dùng từ module ThongBao / TimXe) cần nâng cấp WebSocket
    location /hub/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /swagger {
        # Chế độ LAN: chặn hẳn (404). Cần Swagger thì đặt lại WEB_BIND=127.0.0.1.
        if ($chan_swagger) { return 404; }
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # Tệp JS/CSS do Vite build có mã băm trong tên (index-AbC123.js): đổi nội dung là đổi tên, nên cho trình duyệt giữ lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả về index.html. index.html KHÔNG được lưu đệm,
    # nếu không trình duyệt sẽ hiện bản giao diện cũ (cùng địa chỉ localhost:8080) cho tới khi bấm tải lại.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
